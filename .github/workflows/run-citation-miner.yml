name: Scheduled Citation Miner

on:
  schedule:
    - cron: '0 3 1 * *'  # Todo dia 1 do mês às 03:00 UTC
  workflow_dispatch:      # Permite rodar manualmente no GitHub

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests beautifulsoup4

      - name: Run Citation Miner
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/miner_citations.py

      - name: Regenerate JSONs if Excel changed
        run: |
          cd "data/JSON Generator"
          python authorsJSON.py
          python papersJSON.py

      - name: Commit and Push Changes if Any
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "data/JSON Generator/dataWASHES-data.xlsx" data/authors.json data/papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update citations and datasets" && git push)