name: Auto-Renew PythonAnywhere Hosting

on:
  schedule:
    # Roda no dia 15 de cada mês às 04:00 UTC
    - cron: '0 4 15 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Renewal Bot
        env:
          PYTHONANYWHERE_USERNAME: "datawashes"
          PYTHONANYWHERE_PASSWORD: ${{ secrets.PYTHONANYWHERE_PASSWORD }}
        run: python scripts/renew_pythonanywhere.py

      - name: 🚨 Notificar Mantenedores em Caso de Falha
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload;
            const body = [
              'O robô Playwright de renovação mensal falhou. O site dataWASHES corre risco de sair do ar em até 30 dias.',
              '',
              '👉 **Ação necessária:** Acessem https://www.pythonanywhere.com e cliquem no botão de renovar hospedagem manualmente no painel web.',
              '',
              `**Run que falhou:** [${run.workflow} #${run.runNumber}](${run.serverUrl}/${run.repository}/actions/runs/${run.runId})`,
              '',
              'Notificando mantenedor de infraestrutura: @vasconcel',
              '',
              'Escopo: alerta restrito a rotinas de infraestrutura/hospedagem.',
              'Atualizações científicas (novos artigos e citações) são enviadas',
              'mensalmente pelo workflow de sincronização do dataset.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 URGENTE: Falha na renovação da hospedagem (PythonAnywhere)',
              body
            });