name: Continuous Deployment to PythonAnywhere

on:
  push:
    branches:
      - main  # Dispara sempre que houver um commit/merge na main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger PythonAnywhere Git Pull & Reload
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          # 1. Executa o git pull no console do PythonAnywhere
          curl -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/datawashes/consoles/34799564/send_input/" \
            -d '{"input": "cd /home/datawashes/mysite && git pull origin main\n"}'

          sleep 5

          # 2. Dispara o Reload da aplicação Web
          curl -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/datawashes/webapps/datawashes.pythonanywhere.com/reload/"
          
          echo "✅ Deploy e Reload concluídos no PythonAnywhere com sucesso!"