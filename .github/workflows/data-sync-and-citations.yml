name: Automatic Dataset Sync & Citation Miner

on:
  schedule:
    - cron: '0 3 1 * *'  # Roda todo dia 1 do mês às 03:00 UTC
  workflow_dispatch:      # Permite rodar manualmente pelo GitHub

jobs:
  sync-and-mine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests beautifulsoup4

      - name: 🌐 Sync Dataset from SOL SBC with Groq & ScraperAPI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/sync_washes_dataset.py

      - name: 🔍 Mine Citations for Existing Papers
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/miner_citations.py

      - name: 🔀 Create Pull Request if Data Changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): auto-sync dataset via Groq & ScraperAPI"
          title: "🤖 Auto-Sync: Atualização de Dados e Citações"
          body: "Pull Request automático com novos anais ingeridos e citações atualizadas do Google Scholar."
          branch: auto-data-sync
          base: main
          delete-branch: true